x-build-template: &a1
    build:
        context: .
        dockerfile: Containerfile
        target: development
        args:
            USER_ID: 1000
            GROUP_ID: 1000
services:
    app:
        <<: *a1
        restart: always
        env_file: .env
        environment:
            - AUTORUN_ENABLED=1
            - PHP_OPCACHE_ENABLE=1
            - XDEBUG_MODE=coverage
            # Publish broadcasts to Reverb over the internal network
            - REVERB_PUBLISH_HOST=reverb
            - REVERB_PUBLISH_PORT=8000
            - REVERB_PUBLISH_SCHEME=http
            # Search service, used when SCOUT_DRIVER=typesense
            - TYPESENSE_HOST=typesense
            - TYPESENSE_PORT=8108
            - TYPESENSE_PROTOCOL=http
        volumes:
            - .:/var/www/html
    reverb:
        <<: *a1
        restart: always
        env_file: .env
        environment:
            - PHP_OPCACHE_ENABLE=1
        volumes:
            - .:/var/www/html
        command: ['php', '/var/www/html/artisan', '--port=8000', 'reverb:start']
        stop_signal: SIGTERM
        healthcheck:
            test:
                - CMD
                - healthcheck-reverb
            start_period: 10s
    queue:
        <<: *a1
        restart: always
        env_file: .env
        environment:
            - PHP_OPCACHE_ENABLE=1
            # Publish broadcasts to Reverb over the internal network
            - REVERB_PUBLISH_HOST=reverb
            - REVERB_PUBLISH_PORT=8000
            - REVERB_PUBLISH_SCHEME=http
            # Search service, used when SCOUT_DRIVER=typesense
            - TYPESENSE_HOST=typesense
            - TYPESENSE_PORT=8108
            - TYPESENSE_PROTOCOL=http
        command:
            ['php', '/var/www/html/artisan', 'queue:work', '--tries=3', '-vvv']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
            start_period: 10s
        volumes:
            - .:/var/www/html
    scheduler:
        <<: *a1
        restart: always
        env_file: .env
        environment:
            - PHP_OPCACHE_ENABLE=1
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s
        volumes:
            - .:/var/www/html
    # Search engine for Scout. It is only used when SCOUT_DRIVER=typesense;
    # the default database engine needs no service. The API key comes from
    # TYPESENSE_API_KEY in .env (the default matches config/scout.php, so set
    # your own anywhere the service is reachable). The port isn't published.
    typesense:
        image: typesense/typesense:30.2
        restart: always
        environment:
            - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
            - TYPESENSE_DATA_DIR=/data
        volumes:
            - typesense-data:/data
        healthcheck:
            test:
                - CMD
                - bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3'
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
volumes:
    typesense-data:
