name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # A real Typesense server, so the search tests also run against it.
    services:
      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_API_KEY: testkey
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: gd, intl
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Setup Application
        run: composer setup

      - name: Wait for Typesense
        run: curl --silent --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8108/health

      - name: Run CI Checks
        run: composer ci:check
        env:
          TYPESENSE_TEST_HOST: 127.0.0.1
          TYPESENSE_TEST_PORT: 8108
          TYPESENSE_TEST_API_KEY: testkey
